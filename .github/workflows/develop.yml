name: Merge/Push in java-common-libs develop branch

on:
  push:
    branches:
      - develop
      - release-*

jobs:
  build:
    uses: ./.github/workflows/build-java-app-workflow.yml

  deploy-maven:
    uses: ./.github/workflows/deploy-maven-repository-workflow.yml
    needs: build
    secrets: inherit
    with:
      cache_key: ${{ needs.build.outputs.cache_key }}
