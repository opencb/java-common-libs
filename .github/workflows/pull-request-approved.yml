name: Pull request approve workflow
run-name: 'Pull request approve workflow ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }} by @${{ github.actor }}'

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Target branch of the PR (github.event.pull_request.base.ref)'
        required: true
        type: string
      head_ref:
        description: 'Source branch of the PR (github.event.pull_request.head.ref)'
        required: true
        type: string

jobs:
  test-xetabase:
    uses: opencb/ci-core/.github/workflows/pull-request-approve.yml@main
    with:
      target_branch: ${{ github.event.pull_request.base.ref }}
      head_ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit