name: "Generate Maven test summary"
description: "Parse Surefire TEST-*.xml reports and write a global and per-module summary in the GitHub step summary"

inputs:
  report_glob:
    description: "Glob pattern to find Surefire XML reports"
    required: false
    default: "./**/surefire-reports/TEST-*.xml"
  title:
    description: "Optional title for the summary section"
    required: false
    default: "Test Summary"

runs:
  using: "composite"
  steps:
    - name: Generate test summary
      # This step parses Surefire reports and writes a formatted summary to GITHUB_STEP_SUMMARY.
      shell: bash
      env:
        REPORT_GLOB: ${{ inputs.report_glob }}
        SUMMARY_TITLE: ${{ inputs.title }}
      run: |
        # Append test summary to the GitHub step summary
        python << 'PY' >> "$GITHUB_STEP_SUMMARY"
        import glob
        import os
        import xml.etree.ElementTree as ET

        pattern = os.environ.get("REPORT_GLOB", "./**/surefire-reports/TEST-*.xml")
        title = os.environ.get("SUMMARY_TITLE", "Test Summary")

        files = glob.glob(pattern, recursive=True)

        print(f"## {title}")
        print()
        if not files:
          print(f"> No Surefire reports found for pattern `{pattern}`.")
          raise SystemExit(0)

        # Global counters
        total_tests = 0
        total_failures = 0
        total_errors = 0
        total_skipped = 0

        # Per-module aggregation
        modules = {}  # module_name -> dict with tests, failures, errors, skipped

        def update_counts(stats, tests, failures, errors, skipped):
          stats["tests"] += tests
          stats["failures"] += failures
          stats["errors"] += errors
          stats["skipped"] += skipped

        for path in files:
          try:
            tree = ET.parse(path)
            root = tree.getroot()
          except Exception:
            # Skip malformed reports
            continue

          # Surefire can produce <testsuite> or <testsuites> as root
          suites = []
          if root.tag == "testsuite":
            suites = [root]
          elif root.tag == "testsuites":
            suites = list(root.findall("testsuite"))
          else:
            continue

          # Determine module name from path
          parts = path.split("/")
          module_name = "root"
          if "target" in parts:
            idx = parts.index("target")
            if idx > 0:
              module_name = parts[idx - 1]

          if module_name not in modules:
            modules[module_name] = {
              "tests": 0,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
            }

          for suite in suites:
            # Attributes are usually stored on the testsuite element
            tests = int(suite.attrib.get("tests", "0") or "0")
            failures = int(suite.attrib.get("failures", "0") or "0")
            errors = int(suite.attrib.get("errors", "0") or "0")
            skipped = int(
              suite.attrib.get("skipped", suite.attrib.get("disabled", "0") or "0")
            )

            total_tests += tests
            total_failures += failures
            total_errors += errors
            total_skipped += skipped

            update_counts(modules[module_name], tests, failures, errors, skipped)

        # Short status line
        print("### Status")
        if total_failures == 0 and total_errors == 0:
          print(f"- ✅ All tests passed ({total_tests} tests, {total_skipped} skipped)")
        else:
          print(
            f"- ❌ Some tests failed "
            f"({total_tests} total, {total_failures} failed, {total_errors} errors, {total_skipped} skipped)"
          )
        print()

        # Global totals table
        print("### Global totals")
        print()
        print("| Total | Failed | Errors | Skipped |")
        print("| ----- | ------ | ------ | ------- |")
        print(f"| {total_tests} | {total_failures} | {total_errors} | {total_skipped} |")
        print()

        # Per-module table
        print("### Totals by module")
        print()
        print("| Module | Total | Failed | Errors | Skipped |")
        print("| ------ | ----- | ------ | ------ | ------- |")

        # Sort modules by name for stable output
        for module_name in sorted(modules.keys()):
          stats = modules[module_name]
          print(
            f"| {module_name} | "
            f"{stats['tests']} | {stats['failures']} | {stats['errors']} | {stats['skipped']} |"
          )
        print()
        PY
